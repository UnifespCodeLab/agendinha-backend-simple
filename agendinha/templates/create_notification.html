{% load static %}
<!DOCTYPE html>
<html>
    <title>Inserir notificação</title>
    <script src="{% static 'js/admin.js' %}"></script>
    <body>
        {% csrf_token %}
        <label for="appointment">ID Agendamento: </label>
        <input type="number" id="appointment" name="appointment"><br>
        <label for="date">Data Agendamento: </label>
        <input type="text" id="date" name="date"><br>
        <label for="title">Título: </label>
        <input type="text" id="title" name="title"><br>
        <label for="description">Descrição: </label>
        <input type="text" id="description" name="description"><br>
        <button onclick="create()">Criar Notificação</button>
        <script>
            async function create() {
                const adminData = await adminLogin(
                    'admin@admin.com',
                    'admin',
                    document.getElementsByName('csrfmiddlewaretoken')[0].value
                );
                
                const titulo = document.getElementById("title").value;
                const descricao = document.getElementById("description").value;
                const data_agendamento = document.getElementById("date").value;
                const id_agendamento = document.getElementById("appointment").value;
                const csrftoken = document.getElementsByName("csrfmiddlewaretoken")[0].value;
                const response = await fetch("/agendinha/api/notificacoes", 
                {
                    method: "POST",
                    headers: {
                        'X-CSRFToken': csrftoken,
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${adminData['token']}`
                    },
                    body: JSON.stringify({
                        titulo, descricao, data_agendamento, id_agendamento: Number(id_agendamento)
                    })
                });
            }
        </script>

    </body>
</html>
