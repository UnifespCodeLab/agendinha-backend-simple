version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "${SERVER_PORT}:8000"
    env_file:
      - .env
    depends_on:
      - postgres

  cron:
    build: .
    command: /app/start-cron.sh
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  postgres_data: